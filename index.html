<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PikaPad</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-content">
                <div class="header-title" style="text-align:center; width:100%;">PikaPad</div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="dashboard-main">
            <!-- Background Decorators -->
            <div class="bg-decor bg-decor-left">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="pixel-decor">
            </div>
            <div class="bg-decor bg-decor-right">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/143.png" alt="Snorlax" class="pixel-decor">
            </div>
            <div class="bg-decor bg-decor-left-bottom">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Bulbasaur" class="pixel-decor">
            </div>
            <div class="bg-decor bg-decor-right-bottom">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="Squirtle" class="pixel-decor">
            </div>

            <!-- Left Column: The Device -->
            <section class="col-device">
                <div class="device-container">
                    <div class="pokedex-device">
                        <!-- Top Panel with Lenses -->
                        <div class="top-panel">
                            <div class="main-lens-border">
                                <div class="main-lens">
                                    <div class="lens-glare"></div>
                                </div>
                            </div>
                            <div class="status-leds">
                                <div class="led red"></div>
                                <div class="led yellow"></div>
                                <div class="led green"></div>
                            </div>
                        </div>

                        <!-- Main Screen Area -->
                        <div class="screen-panel">
                            <div class="screen-bezel">
                                <div class="screen-header-leds">
                                    <div class="tiny-led red"></div>
                                    <div class="tiny-led red"></div>
                                </div>
                                <div class="lcd-screen" id="lcd-screen">
                                    <div class="loading-text">BOOTING...</div>
                                </div>
                            </div>
                        </div>

                        <!-- Controls Area -->
                        <div class="controls-panel">
                            <div class="d-pad">
                                <div class="d-pad-row top">
                                    <button class="d-btn up" id="btn-up"></button>
                                </div>
                                <div class="d-pad-row middle">
                                    <button class="d-btn left" id="btn-prev"></button>
                                    <div class="d-center">
                                        <div class="d-center-dent"></div>
                                    </div>
                                    <button class="d-btn right" id="btn-next"></button>
                                </div>
                                <div class="d-pad-row bottom">
                                    <button class="d-btn down" id="btn-down"></button>
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <div class="pill-buttons">
                                    <button class="pill-btn blue" id="btn-pokedex">추가</button>
                                    <button class="pill-btn green" id="btn-team">파티</button>
                                    <button class="pill-btn yellow" id="btn-bgm">BGM</button>
                                </div>
                                <div class="search-input-wrapper">
                                    <input type="text" id="pokemon-search" class="retro-input" placeholder="ID,이름 검색!">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Column: Stats & Evo -->
            <section class="col-details">
                <!-- Base Stats Card -->
                <div class="dashboard-card">
                    <h3 class="card-title">스탯<h3>
                    <div class="stats-container" id="stats-container">
                        <!-- JS Injected Stats -->
                        <div class="loading-text" style="color:var(--deep-black)">데이터 대기중...</div>
                    </div>
                </div>

                <!-- Evolution Chain Card -->
                <div class="dashboard-card">
                    <h3 class="card-title">진화 트리</h3>
                    <div class="evo-container" id="evo-container">
                        <div class="loading-text" style="color:var(--deep-black)">데이터 대기중...</div>
                    </div>
                </div>
            </section>

            <!-- Bottom Row: Dialogue -->
            <section class="col-dialogue">
                <div class="dialogue-box">
                    <div class="dialogue-inner">
                        <div class="dialogue-text" id="dialogue-text">
                            기기를 조작하여 포켓몬 데이터를 탐색하세요.
                        </div>
                        <div class="dialogue-cursor"></div>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Footer -->
        <footer class="bottom-footer">
            <div class="footer-content">
                <div class="footer-copy">©1996 POKÉMON CREATURES</div>
                <div class="footer-links">
                    <span>VERSION 1.0.2</span>
                    <span>CREDITS</span>
                    <span class="highlight">D-PAD NAV</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Team Viewer Modal -->
    <div id="team-modal" class="team-modal hidden">
        <div class="team-modal-content">
            <div class="team-modal-header">
                <h2>POKE-OS 팀 뷰어</h2>
                <button id="btn-close-team" class="btn-close">X</button>
            </div>
            <div class="team-grid" id="team-grid">
                <!-- 6 Slots will be generated by JS -->
            </div>
            <div class="team-modal-footer">
                <span>클릭 시 파티에서 방출됩니다</span>
            </div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="page-bgm" src="./src/page-bgm.mp3" loop></audio>

    <!-- Scripts -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
